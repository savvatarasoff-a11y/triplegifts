    <rect x="-300" y="-120" width="184" height="240" rx="40" fill="url(#reel)"/>
    <rect x="-92" y="-120" width="184" height="240" rx="40" fill="url(#reel)"/>
    <rect x="116" y="-120" width="184" height="240" rx="40" fill="url(#reel)"/>
  </g>
  <g font-family="'DejaVu Sans','Arial Black',Arial,sans-serif" font-weight="900" font-size="190" text-anchor="middle" fill="url(#goldv)">
    <text x="-208" y="66">7</text><text x="0" y="66">7</text><text x="208" y="66">7</text>
  </g>
  <rect x="-330" y="-4" width="660" height="8" fill="#FFD166" opacity=".45"/>
  <!-- ручка -->
  <rect x="338" y="-60" width="22" height="130" rx="11" fill="url(#gold)"/><circle cx="349" cy="-78" r="30" fill="url(#goldv)"/>
</g>
<!-- подарки и монеты вокруг -->
<use href="#g" x="150" y="170" width="190" height="190" transform="rotate(-12 245 265)"/>
<use href="#g" x="1030" y="190" width="160" height="160" transform="rotate(14 1110 270)"/>
