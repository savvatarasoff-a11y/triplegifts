<use href="#c" x="900" y="380" width="90" height="90"/>
<use href="#c" x="360" y="400" width="70" height="70"/>
<use href="#c" x="1110" y="90" width="64" height="64"/>
<g><use href="#s" x="250" y="110" width="36" height="36"/><use href="#s" x="1010" y="120" width="44" height="44"/>
<use href="#s" x="470" y="70" width="28" height="28"/><use href="#s" x="820" y="60" width="34" height="34"/>
<use href="#s" x="110" y="380" width="30" height="30"/><use href="#s" x="1160" y="330" width="34" height="34"/></g>
