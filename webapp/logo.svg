<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Triple Gifts">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B1712"/><stop offset="1" stop-color="#08080B"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="58%" r="50%">
      <stop offset="0" stop-color="#F5B93C" stop-opacity=".30"/><stop offset="1" stop-color="#F5B93C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE7A0"/><stop offset=".45" stop-color="#F7BE45"/><stop offset="1" stop-color="#D98C12"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1C7"/><stop offset="1" stop-color="#F5B93C"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="512" height="512" rx="128" fill="url(#halo)"/>
  <!-- бант из трёх петель — «Triple» -->
  <g fill="url(#loop)">
    <rect x="226" y="72" width="60" height="112" rx="30"/>
    <rect x="226" y="72" width="60" height="112" rx="30" transform="rotate(-52 256 176)"/>
    <rect x="226" y="72" width="60" height="112" rx="30" transform="rotate(52 256 176)"/>
  </g>
  <!-- коробка -->
  <rect x="112" y="196" width="288" height="236" rx="44" fill="url(#gold)"/>
  <!-- лента в форме буквы T -->
  <path d="M112 240a44 44 0 0 1 44-44h200a44 44 0 0 1 44 44v24H292v168h-72V264H112z" fill="#14100A"/>
  <circle cx="256" cy="186" r="26" fill="#14100A"/>
  <circle cx="256" cy="186" r="11" fill="#F7BE45"/>
</svg>
