name: host

# Временный хостинг бота на GitHub Actions.
# Одновременно работает только один запуск; следующий ждёт в очереди и стартует сразу после текущего.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/20 * * * *"   # держит в очереди следующий запуск и поднимает бота, если он упал

concurrency:
  group: host
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Бот
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/gh_host.sh
