name: host

# Временный хостинг бота на GitHub Actions. Первый запуск — вручную (Actions → host → Run workflow).
# Проработав 2 минуты без сбоев, запуск ставит в очередь следующий; тот стартует сразу после текущего.
# Одновременно работает только одна копия бота.
on:
  workflow_dispatch:

concurrency:
  group: host
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Бот
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          CHAIN_WORKFLOW: host.yml
        run: bash scripts/gh_host.sh
